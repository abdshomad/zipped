[project]
name = "zipped-evaluator"
version = "0.1.0"
description = "Multi-tokenizer benchmark and semantic losslessness evaluator for zipped"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
